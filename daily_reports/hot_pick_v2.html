
<!DOCTYPE html>

    .container { max-width: 500px; background: #fff; border-radius: 0; overflow: hidden; }
    .header { background: linear-gradient(135deg, #ff0000, #ff4444); padding: 30px; text-align: center; }
    .header h1 { color: #fff000; font-size: 42px; font-weight: 900; text-shadow: 2px 2px 0 #000; letter-spacing: 2px; animation: pulse 1s infinite; }

    .stock { border: 3px solid #ff0000; padding: 20px; margin-bottom: 15px; }
    .stock-name { font-size: 24px; font-weight: 900; color: #000; }
    .stock-code { color: #666; font-size: 14px; }
    .stock-reason { color: #ff0000; font-weight: bold; margin-top: 10px; font-size: 16px; }
    .huge { font-size: 36px; color: #ff0000; font-weight: 900; text-align: center; margin: 20px 0; }
    .cta { background: #ff0000; color: white; text-align: center; padding: 25px; }
    .cta-text { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
    .cta-btn { background: #fff000; color: #000; padding: 15px 30px; font-size: 20px; font-weight: bold; text-decoration: none; display: inline-block; }
