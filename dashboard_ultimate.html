<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 SuperBrain Pro - Ultimate Trading Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header .subtitle { font-size: 1.2em; opacity: 0.9; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .stock-item:hover { transform: translateX(5px); }
        
        .stock-info { flex: 1; }
        .stock-name { font-weight: bold; font-size: 1.1em; }
        .stock-code { opacity: 0.7; font-size: 0.9em; }
        
        .score { 
            font-size: 2em; 
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .score.strong_buy { background: linear-gradient(135deg, #00c853, #69f0ae); color: #000; }
        .score.buy { background: linear-gradient(135deg, #4caf50, #81c784); color: #000; }
        .score.watch { background: linear-gradient(135deg, #ff9800, #ffb74d); color: #000; }
        .score.sell { background: linear-gradient(135deg, #f44336, #e57373); color: #fff; }
        
        .alert-box {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-buy { background: rgba(76, 175, 80, 0.3); border-left: 4px solid #4caf50; }
        .alert-sell { background: rgba(244, 67, 54, 0.3); border-left: 4px solid #f44336; }
        .alert-warning { background: rgba(255, 152, 0, 0.3); border-left: 4px solid #ff9800; }
        
        .caution-level {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .caution-normal { background: linear-gradient(135deg, #4caf50, #81c784); color: #000; }
        .caution-caution { background: linear-gradient(135deg, #ff9800, #ffb74d); color: #000; }
        .caution-high { background: linear-gradient(135deg, #f44336, #e57373); color: #fff; }
        .caution-critical { 
            background: linear-gradient(135deg, #9c27b0, #e91e63); 
            color: #fff;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .momentum-bar {
            height: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .momentum-fill {
            height: 100%;
            border-radius: 15px;
            transition: width 0.5s ease;
        }
        
        .pattern-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin: 3px;
        }
        .pattern-bullish { background: #4caf50; }
        .pattern-bearish { background: #f44336; }
        
        .knowledge-event {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border-left: 3px solid;
        }
        .event-high { border-color: #f44336; }
        .event-medium { border-color: #ff9800; }
        
        .chart-container {
            height: 250px;
            margin: 20px 0;
        }
        
        .last-update {
            text-align: center;
            opacity: 0.6;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 40px;
            font-size: 1.1em;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover { transform: scale(1.05); }
        
        /* Candlestick Legend */
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color {
            width: 20px;
            height: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 SuperBrain Pro</h1>
        <div class="subtitle">Ultimate Trading Intelligence System v4.0</div>
    </div>
    
    <div class="caution-level caution-normal" id="cautionLevel">
        ⚡ Market Status: NORMAL
    </div>
    
    <button class="refresh-btn" onclick="runAnalysis()">🔄 Refresh Analysis</button>
    
    <div class="grid">
        <!-- Real-time Scores -->
        <div class="card">
            <h3>📊 Live Scores</h3>
            <div id="stockScores"></div>
        </div>
        
        <!-- Smart Alerts -->
        <div class="card">
            <h3>⚠️ Smart Alerts</h3>
            <div id="alerts"></div>
        </div>
        
        <!-- Momentum -->
        <div class="card">
            <h3>📈 Momentum Indicators</h3>
            <div id="momentum"></div>
        </div>
        
        <!-- Patterns -->
        <div class="card">
            <h3>🕯️ Candlestick Patterns</h3>
            <div id="patterns"></div>
        </div>
    </div>
    
    <div class="grid">
        <!-- Knowledge Base -->
        <div class="card">
            <h3>📚 Knowledge Base - Market Events</h3>
            <div id="knowledge"></div>
        </div>
        
        <!-- Chart -->
        <div class="card">
            <h3>📉 Live Price Chart</h3>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>
    
    <div class="last-update" id="lastUpdate"></div>
    
    <script>
        // Chart setup
        let priceChart;
        
        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Price',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.1)' } },
                        y: { grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });
        }
        
        function updateChart(prices) {
            priceChart.data.labels = prices.map((_, i) => `T${i+1}`);
            priceChart.data.datasets[0].data = prices;
            priceChart.update();
        }
        
        function getScoreClass(score) {
            if (score >= 75) return 'strong_buy';
            if (score >= 55) return 'buy';
            if (score >= 40) return 'watch';
            return 'sell';
        }
        
        function getCautionClass(level) {
            return 'caution-' + level.toLowerCase();
        }
        
        function runAnalysis() {
            // Simulated real-time data
            const stocks = [
                { symbol: '600036', name: '招商银行', price: 38.72, change: 1.45, score: 82 },
                { symbol: '300015', name: '爱尔眼科', price: 28.50, change: -2.10, score: 45 },
                { symbol: '0700', name: '腾讯控股', price: 519.00, change: 0.57, score: 78 },
                { symbol: '601012', name: '隆基绿能', price: 18.00, change: -0.44, score: 65 }
            ];
            
            const alerts = [
                { type: 'BUY', message: '600036 招商银行: RSI oversold - BUY signal', level: 'buy' },
                { type: 'SELL', message: '300015 爱尔眼科: -2.1% drop - Check stop loss', level: 'sell' },
                { type: 'WARNING', message: 'Market caution: Multiple signals detected', level: 'warning' }
            ];
            
            const patterns = [
                { name: 'Bullish Engulfing', type: 'bullish', confidence: 80 },
                { name: 'Morning Star', type: 'bullish', confidence: 85 },
                { name: 'RSI Oversold', type: 'bullish', confidence: 75 }
            ];
            
            const momentum = [
                { indicator: 'RSI', value: 42, max: 100 },
                { indicator: 'MACD', value: 0.25, max: 1 },
                { indicator: 'Stochastic', value: 35, max: 100 }
            ];
            
            const knowledge = [
                { name: 'Fed Rate Decision', impact: 'HIGH', desc: 'US Fed meeting next week', level: 'high' },
                { name: 'China GDP', impact: 'MEDIUM', desc: 'Q1 data release Friday', level: 'medium' }
            ];
            
            // Update UI
            document.getElementById('cautionLevel').className = 'caution-level caution-normal';
            document.getElementById('cautionLevel').innerHTML = '⚡ Market Status: NORMAL';
            
            // Stock Scores
            let scoresHTML = '';
            stocks.forEach(s => {
                scoresHTML += `
                    <div class="stock-item">
                        <div class="stock-info">
                            <div class="stock-name">${s.name}</div>
                            <div class="stock-code">${s.symbol} | ¥${s.price} (${s.change > 0 ? '+' : ''}${s.change}%)</div>
                        </div>
                        <div class="score ${getScoreClass(s.score)}">${s.score}</div>
                    </div>
                `;
            });
            document.getElementById('stockScores').innerHTML = scoresHTML;
            
            // Alerts
            let alertsHTML = '';
            alerts.forEach(a => {
                alertsHTML += `<div class="alert-box alert-${a.level}">${a.message}</div>`;
            });
            document.getElementById('alerts').innerHTML = alertsHTML || '<div style="opacity:0.5">No active alerts</div>';
            
            // Momentum
            let momentumHTML = '';
            momentum.forEach(m => {
                const pct = (m.value / m.max) * 100;
                const color = pct > 70 ? '#4caf50' : pct > 40 ? '#ff9800' : '#f44336';
                momentumHTML += `
                    <div style="margin: 15px 0;">
                        <div style="display:flex;justify-content:space-between;">
                            <span>${m.indicator}</span>
                            <span>${m.value.toFixed(2)}</span>
                        </div>
                        <div class="momentum-bar">
                            <div class="momentum-fill" style="width:${pct}%;background:${color}"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('momentum').innerHTML = momentumHTML;
            
            // Patterns
            let patternsHTML = '';
            patterns.forEach(p => {
                patternsHTML += `<span class="pattern-badge pattern-${p.type}">${p.name} (${p.confidence}%)</span>`;
            });
            document.getElementById('patterns').innerHTML = patternsHTML || '<div style="opacity:0.5">No patterns detected</div>';
            
            // Knowledge
            let knowledgeHTML = '';
            knowledge.forEach(k => {
                knowledgeHTML += `
                    <div class="knowledge-event event-${k.level}">
                        <strong>${k.name}</strong> [${k.impact}]<br>
                        <small>${k.desc}</small>
                    </div>
                `;
            });
            document.getElementById('knowledge').innerHTML = knowledgeHTML;
            
            // Update chart
            updateChart([37.5, 38.0, 38.2, 38.5, 38.3, 38.6, 38.72]);
            
            // Last update
            document.getElementById('lastUpdate').innerHTML = `Last updated: ${new Date().toLocaleString()}`;
        }
        
        // Auto-refresh every 30 seconds
        initChart();
        runAnalysis();
        setInterval(runAnalysis, 30000);
    </script>
</body>
</html>
