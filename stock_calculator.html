<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            color: #e6edf3;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #58a6ff, #3fb950, #f0883e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.6);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(88, 166, 255, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(48, 54, 61, 0.6);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e6edf3;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 8px;
            color: #e6edf3;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .input-group input::placeholder {
            color: #484f58;
        }

        .result {
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin-top: 20px;
        }

        .result-label {
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #58a6ff;
        }

        .result-value.positive {
            color: #3fb950;
        }

        .result-value.negative {
            color: #f85149;
        }

        .icon-position { background: rgba(88, 166, 255, 0.2); }
        .icon-pnl { background: rgba(63, 185, 80, 0.2); }
        .icon-stop { background: rgba(248, 81, 73, 0.2); }
        .icon-value { background: rgba(163, 113, 247, 0.2); }
        .icon-roi { background: rgba(240, 136, 62, 0.2); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .card:nth-child(1) { animation-delay: 0s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.3s; }
        .card:nth-child(5) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Stock Calculator</h1>
        <p class="subtitle">Professional trading tools for smarter decisions</p>
        
        <div class="grid">
            <!-- Position Size Calculator -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon icon-position">💼</div>
                    <div class="card-title">Position Size</div>
                </div>
                <div class="input-group">
                    <label>Capital ($)</label>
                    <input type="number" id="capital" placeholder="10000" oninput="calcPosition()">
                </div>
                <div class="input-group">
                    <label>Share Price ($)</label>
                    <input type="number" id="price" placeholder="50" oninput="calcPosition()">
                </div>
                <div class="result">
                    <div class="result-label">Shares</div>
                    <div class="result-value" id="position-result">0</div>
                </div>
            </div>

            <!-- P/L Calculator -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon icon-pnl">📈</div>
                    <div class="card-title">Profit / Loss</div>
                </div>
                <div class="input-group">
                    <label>Buy Price ($)</label>
                    <input type="number" id="buyPrice" placeholder="50" oninput="calcPnL()">
                </div>
                <div class="input-group">
                    <label>Sell Price ($)</label>
                    <input type="number" id="sellPrice" placeholder="60" oninput="calcPnL()">
                </div>
                <div class="input-group">
                    <label>Shares</label>
                    <input type="number" id="shares" placeholder="100" oninput="calcPnL()">
                </div>
                <div class="result">
                    <div class="result-label">P/L</div>
                    <div class="result-value" id="pnl-result">$0.00</div>
                </div>
            </div>

            <!-- Stop Loss Calculator -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon icon-stop">🛡️</div>
                    <div class="card-title">Stop Loss</div>
                </div>
                <div class="input-group">
                    <label>Buy Price ($)</label>
                    <input type="number" id="slBuyPrice" placeholder="50" oninput="calcStopLoss()">
                </div>
                <div class="input-group">
                    <label>Stop Loss Price ($)</label>
                    <input type="number" id="stopLoss" placeholder="45" oninput="calcStopLoss()">
                </div>
                <div class="input-group">
                    <label>Shares</label>
                    <input type="number" id="slShares" placeholder="100" oninput="calcStopLoss()">
                </div>
                <div class="result">
                    <div class="result-label">Max Loss</div>
                    <div class="result-value negative" id="stoploss-result">$0.00</div>
                </div>
            </div>

            <!-- Position Value Calculator -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon icon-value">💰</div>
                    <div class="card-title">Position Value</div>
                </div>
                <div class="input-group">
                    <label>Shares</label>
                    <input type="number" id="valShares" placeholder="100" oninput="calcValue()">
                </div>
                <div class="input-group">
                    <label>Current Price ($)</label>
                    <input type="number" id="valPrice" placeholder="55" oninput="calcValue()">
                </div>
                <div class="result">
                    <div class="result-label">Total Value</div>
                    <div class="result-value" id="value-result">$0.00</div>
                </div>
            </div>

            <!-- ROI Calculator -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon icon-roi">🎯</div>
                    <div class="card-title">ROI</div>
                </div>
                <div class="input-group">
                    <label>Cost Basis ($)</label>
                    <input type="number" id="costBasis" placeholder="5000" oninput="calcROI()">
                </div>
                <div class="input-group">
                    <label>Current Value ($)</label>
                    <input type="number" id="currentValue" placeholder="6000" oninput="calcROI()">
                </div>
                <div class="result">
                    <div class="result-label">Return on Investment</div>
                    <div class="result-value" id="roi-result">0.00%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatNumber(num) {
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(num);
        }

        function formatCurrency(num) {
            return '$' + formatNumber(num);
        }

        function calcPosition() {
            const capital = parseFloat(document.getElementById('capital').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const shares = price > 0 ? capital / price : 0;
            document.getElementById('position-result').textContent = formatNumber(Math.floor(shares));
        }

        function calcPnL() {
            const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
            const sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
            const shares = parseFloat(document.getElementById('shares').value) || 0;
            const pnl = (sellPrice - buyPrice) * shares;
            
            const el = document.getElementById('pnl-result');
            el.textContent = formatCurrency(pnl);
            el.className = 'result-value ' + (pnl >= 0 ? 'positive' : 'negative');
        }

        function calcStopLoss() {
            const buyPrice = parseFloat(document.getElementById('slBuyPrice').value) || 0;
            const stopLoss = parseFloat(document.getElementById('stopLoss').value) || 0;
            const shares = parseFloat(document.getElementById('slShares').value) || 0;
            const maxLoss = shares * (buyPrice - stopLoss);
            
            document.getElementById('stoploss-result').textContent = formatCurrency(Math.max(0, maxLoss));
        }

        function calcValue() {
            const shares = parseFloat(document.getElementById('valShares').value) || 0;
            const price = parseFloat(document.getElementById('valPrice').value) || 0;
            const totalValue = shares * price;
            
            document.getElementById('value-result').textContent = formatCurrency(totalValue);
        }

        function calcROI() {
            const costBasis = parseFloat(document.getElementById('costBasis').value) || 0;
            const currentValue = parseFloat(document.getElementById('currentValue').value) || 0;
            const roi = costBasis > 0 ? ((currentValue - costBasis) / costBasis) * 100 : 0;
            
            const el = document.getElementById('roi-result');
            el.textContent = formatNumber(roi) + '%';
            el.className = 'result-value ' + (roi >= 0 ? 'positive' : 'negative');
        }
    </script>
</body>
</html>
